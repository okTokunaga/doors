<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>扉 解錠</title>
<style>
:root{
  --wall:#D8D7D3; --panel:#FFFFFF; --ink:#000; --sub:#55544F; --led:#2BD36B; --head:#55544F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root{ --wall:#1C1C1A; --panel:#F2F1EC; --head:#A9A8A2; } }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--wall); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
main{
  height:100%; max-width:520px; margin:0 auto; padding:14px 14px 18px;
  display:grid; grid-template-rows:auto 1fr 1fr 1fr; gap:14px;
}
h1{margin:4px 4px 0; font-size:15px; font-weight:700; color:var(--head)}
.door{
  position:relative; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:18px;
  background:var(--panel); color:var(--ink); text-decoration:none;
  border:5px solid var(--ink); border-radius:6px; padding:12px 22px; min-height:0;
  transition:transform .08s ease;
}
.door:active{transform:scale(.985)}
.door:focus-visible{outline:4px solid var(--led); outline-offset:3px}
.num{
  height:min(78%,130px); aspect-ratio:1; border:4px solid var(--ink); border-radius:50%;
  display:grid; place-items:center; font-size:clamp(48px,15vw,84px); font-weight:500; line-height:1;
}
.label{display:flex; flex-direction:column; gap:6px}
.label b{font-size:clamp(24px,7vw,32px); font-weight:800; line-height:1.15}
.label span{font-size:15px; color:var(--sub)}
.led{position:absolute; top:12px; right:14px; width:12px; height:12px; border-radius:3px; background:#BDBCB7}
.door.sent .led{background:var(--led); box-shadow:0 0 10px var(--led)}
@media (prefers-reduced-motion: reduce){ .door{transition:none} }
</style>
</head>
<body>
<main>
  <h1>BIZcomfort センター南</h1>
  <a class="door" href="https://mypage.bizcomfort.jp/unlock/entry/a0KRB000018nRiN2AU/">
    <span class="led" aria-hidden="true"></span>
    <span class="num" aria-hidden="true">1</span>
    <span class="label"><b>扉①を開ける</b><span>別室</span></span>
  </a>
  <a class="door" href="https://mypage.bizcomfort.jp/unlock/exit/a0KRB000018nRiO2AU/">
    <span class="led" aria-hidden="true"></span>
    <span class="num" aria-hidden="true">2</span>
    <span class="label"><b>扉②を開ける</b><span>1F・階段の手前</span></span>
  </a>
  <a class="door" href="https://mypage.bizcomfort.jp/unlock/exit/a0KRB000018nRiP2AU/">
    <span class="led" aria-hidden="true"></span>
    <span class="num" aria-hidden="true">3</span>
    <span class="label"><b>扉③を開ける</b><span>2F・事務所</span></span>
  </a>
</main>
<script>
document.querySelectorAll('.door').forEach(function(a){
  a.addEventListener('click',function(){
    document.querySelectorAll('.door').forEach(function(d){d.classList.remove('sent')});
    a.classList.add('sent');
  });
});
</script>
</body>
</html>
